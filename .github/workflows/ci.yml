# Format, lint, typecheck and build on every PR to main and every push to main.
# Deploy (Cloudflare Workers) is a separate workflow: deploy.yml. This build is only a compile
# check, so it runs without the production VITE_* values and the app falls back to mock data.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --reporter=github .

      - name: Lint
        run: pnpm exec biome check --formatter-enabled=false --reporter=github .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
