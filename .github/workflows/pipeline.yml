name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Runners are pinned instead of ubuntu-latest, which moves to Ubuntu 26.04 from 2026-10-19: an OS upgrade
# should be a change in this file, not a surprise. workerd (wrangler) needs glibc 2.35+; 24.04 has 2.39.
jobs:
  ci:
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm exec biome format --reporter=github .

      - name: Lint
        run: pnpm exec biome check --formatter-enabled=false --reporter=github .

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  # Every migration, applied from scratch to a throwaway database, before any of them reach production.
  # Runs beside `ci`, and `deploy` waits for both.
  migrations:
    runs-on: ubuntu-24.04
    concurrency:
      group: migrations-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Starts Supabase's Postgres in Docker (same extensions as the hosted project: pg_cron, pgmq, pg_net,
      # vault) and runs supabase/migrations in order. A migration that doesn't run stops here.
      - name: Apply migrations to a fresh database
        run: supabase db start

      # Postgres checks a plpgsql function's body only when it's called, so a function that names a missing
      # column or table still creates fine above. plpgsql_check reads every body now and fails on errors.
      - name: Lint database functions
        run: supabase db lint --local --level error --fail-on error

  deploy:
    needs: [ci, migrations]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # With SENTRY_AUTH_TOKEN set, the build also uploads the browser's source maps to Sentry and deletes them
      # from .output/public (vite.config.ts). Without it the build skips that and still succeeds.
      - name: Build
        run: pnpm build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}

      # The Supabase steps run once the variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN
      # and SUPABASE_DB_PASSWORD are set.
      - name: Setup Supabase CLI
        if: vars.SUPABASE_PROJECT_REF != ''
        uses: supabase/setup-cli@v3
        with:
          version: latest

      # Schema before code, so the Worker deployed next never reads a column that isn't there yet.
      # `db push` runs only the migrations the project hasn't recorded, and never seed.sql.
      - name: Apply database migrations
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # After the Worker: the notifier sends buttons whose presses the Worker's webhook handles.
      - name: Deploy notifier
        if: vars.SUPABASE_PROJECT_REF != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy notifier --project-ref "$SUPABASE_PROJECT_REF"
