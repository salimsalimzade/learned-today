# Supabase CLI config for local development (`pnpm db:start`). Anything left out uses the CLI default.
project_id = "learned-today"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

# Turn these on once the OAuth apps exist. Callback URL for both:
# http://127.0.0.1:54321/auth/v1/callback (local) or https://<ref>.supabase.co/auth/v1/callback
[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Called by pg_cron with the service-role key (see 0003_triggers.sql).
[functions.notifier]
verify_jwt = true
